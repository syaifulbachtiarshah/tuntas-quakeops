<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="2200" viewBox="0 0 1400 2200" role="img" aria-labelledby="title desc">
<title id="title">Earth Q — Dungun &amp; PSMZA: gempa, tsunami dan kesiapsiagaan</title>
<desc id="desc">Infografik pendidikan dengan rekod Kenyir, senario model Dungun dan tindakan keselamatan. Bukan amaran semasa atau peta pemindahan.</desc>
<rect width="1400" height="2200" fill="#071c29"/>
<path d="M1000 0H1400V245L1000 70Z" fill="#123840"/>
<path d="M1080 0H1400V145L1080 45Z" fill="#1e5b5e"/>
<text x="64" y="65" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700" fill="#90ecdc">EARTH Q   /   RUJUKAN PENDIDIKAN</text>
<text x="64" y="144" font-family="DejaVu Sans, sans-serif" font-size="66" font-weight="700" fill="#ffffff">DUNGUN &amp; PSMZA</text>
<text x="64" y="200" font-family="DejaVu Sans, sans-serif" font-size="34" font-weight="400" fill="#c4e5e8">Gempa, tsunami dan kesiapsiagaan</text>
<rect x="64" y="234" width="1272" height="63" rx="14" fill="#143b46"/>
<text x="86" y="275" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#b8f3ed">SEMAKAN 13 SEP 2026  ·  BUKAN AMARAN SEMASA</text>
<text x="64" y="353" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="700" fill="#8fe9da">01  /  REKOD TERENGGANU</text>
<path d="M90 399V680" stroke="#467783" stroke-width="3"/>
<circle cx="90" cy="388" r="9" fill="#90ecdc"/>
<text x="121" y="398" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="700" fill="#ffffff">1985–1987</text>
<text x="407" y="398" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="700" fill="#ffffff">Siri gempa Kenyir</text>
<text x="407" y="439" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="400" fill="#d0e1e7">Kajian merangkum 27 gegaran, magnitud mb 2.5–4.6, berkaitan</text>
<text x="407" y="476" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="400" fill="#d0e1e7">pengisian takungan.</text>
<circle cx="90" cy="503" r="9" fill="#90ecdc"/>
<text x="121" y="513" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="700" fill="#ffffff">10 Mac 2010</text>
<text x="407" y="513" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="700" fill="#ffffff">Gempa Kenyir direkodkan</text>
<text x="407" y="554" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="400" fill="#d0e1e7">Magnitud 2.6 menurut laporan Bernama yang memetik Jabatan</text>
<text x="407" y="591" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="400" fill="#d0e1e7">Meteorologi Malaysia.</text>
<circle cx="90" cy="618" r="9" fill="#90ecdc"/>
<text x="121" y="628" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="700" fill="#ffffff">23 Feb 2016</text>
<text x="407" y="628" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="700" fill="#ffffff">Ada laporan penduduk</text>
<text x="407" y="669" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="400" fill="#d0e1e7">Sembilan kampung sekitar Kuala Berang dilaporkan merasai</text>
<text x="407" y="706" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="400" fill="#d0e1e7">gegaran, termasuk Jenagor.</text>
<rect x="64" y="728" width="1272" height="88" rx="14" fill="#13313c"/>
<text x="88" y="764" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="600" fill="#c8e7ed">Rekod Kenyir tidak mengesahkan gegaran dirasai di Dungun atau PSMZA.</text>
<rect x="64" y="850" width="1272" height="432" rx="14" fill="#261f39" stroke="#65517e"/>
<text x="92" y="899" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="700" fill="#d6beff">02  /  DUNGUN DALAM SENARIO KAJIAN</text>
<text x="92" y="944" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="400" fill="#e0d4f2">Model TUNA · Manila Trench Mw 9.0 · Aziz et al. (2023)</text>
<text x="96" y="1024" font-family="DejaVu Sans, sans-serif" font-size="64" font-weight="700" fill="#ffffff">5.7 m</text>
<text x="750" y="1024" font-family="DejaVu Sans, sans-serif" font-size="64" font-weight="700" fill="#ffffff">4.6 km</text>
<text x="98" y="1068" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="400" fill="#e0d4f2">Maksimum kedalaman limpahan</text>
<text x="752" y="1068" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="400" fill="#e0d4f2">Maksimum jarak ke daratan</text>
<text x="92" y="1123" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="400" fill="#d0e1e7">Petak pesisir Dungun T8–T11; kedalaman maksimum dibincangkan antara Kampung</text>
<text x="92" y="1160" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="400" fill="#d0e1e7">Kerta Pulas dan Kampung Kongsi.</text>
<rect x="87" y="1194" width="1226" height="66" rx="14" fill="#473450"/>
<text x="110" y="1238" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="700" fill="#ffffff">HASIL MODEL — BUKAN PARAS AIR DI PSMZA</text>
<text x="64" y="1345" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="700" fill="#8fe9da">03  /  KONTEKS PSMZA</text>
<text x="64" y="1393" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="400" fill="#d0e1e7">KM 8, Jalan Paka, 23000 Dungun, Terengganu · MQA</text>
<text x="64" y="1443" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="400" fill="#eef6f7">Bahaya bagi bangunan kampus belum ditentukan dalam modul ini. Perlukan data aras</text>
<text x="64" y="1483" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="400" fill="#eef6f7">tanah, model setempat dan pelan pemindahan yang disahkan kampus.</text>
<text x="64" y="1580" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="700" fill="#8fe9da">04  /  TINDAKAN ANDA</text>
<rect x="64" y="1610" width="1272" height="130" rx="14" fill="#11372f"/>
<circle cx="108" cy="1652" r="24" fill="#a0efd2"/>
<text x="98" y="1662" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="700" fill="#092e26">1</text>
<text x="153" y="1653" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="700" fill="#ffffff">Semasa gegaran: tunduk, lindung, pegang.</text>
<text x="153" y="1693" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="400" fill="#d1e8df">Dalam bangunan, lindungi kepala dan leher di bawah meja kukuh. Tunggu gegaran</text>
<text x="153" y="1727" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="400" fill="#d1e8df">berhenti sebelum bergerak keluar.</text>
<rect x="64" y="1753" width="1272" height="130" rx="14" fill="#11372f"/>
<circle cx="108" cy="1795" r="24" fill="#a0efd2"/>
<text x="98" y="1805" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="700" fill="#092e26">2</text>
<text x="153" y="1796" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="700" fill="#ffffff">Di pesisir: kenali tanda tsunami.</text>
<text x="153" y="1836" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="400" fill="#d1e8df">Gegaran kuat/lama, air laut berubah mendadak atau deruman luar biasa: selepas gegaran</text>
<text x="153" y="1870" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="400" fill="#d1e8df">berhenti, ke tempat tinggi atau pedalaman.</text>
<rect x="64" y="1896" width="1272" height="130" rx="14" fill="#11372f"/>
<circle cx="108" cy="1938" r="24" fill="#a0efd2"/>
<text x="98" y="1948" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="700" fill="#092e26">3</text>
<text x="153" y="1939" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="700" fill="#ffffff">Ikut arahan pemindahan pihak berkuasa.</text>
<text x="153" y="1979" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="400" fill="#d1e8df">Jangan ke pantai menonton. Kekal di kawasan selamat sehingga dibenarkan kembali.</text>
<text x="153" y="2013" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="400" fill="#d1e8df">Semak makluman METMalaysia.</text>
<text x="64" y="2073" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="600" fill="#9fbac6">SUMBER  ·  Pautan lengkap dan nota kaedah tersedia dalam Earth Q.</text>
<text x="64" y="2106" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#9fbac6">Kenyir: doi.org/10.1007/s42452-021-04686-2  ·  Bernama: malaysiakini.com/news/331459</text>
<text x="64" y="2137" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#9fbac6">Dungun: doi.org/10.1007/s13201-022-01860-8  ·  Alamat: MQA  ·  Panduan: METMalaysia &amp; NOAA/NWS</text>
<text x="64" y="2171" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#c5d7df">Bahan kesedaran Earth Q. Bukan kenyataan rasmi atau pelan pemindahan PSMZA.</text>
</svg>